name: Publish APK feed

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the published APKs match
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.feed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for releases and build signed feed
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          XGP_RELEASE_READ_TOKEN: ${{ secrets.XGP_RELEASE_READ_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE_REBUILD" == true ]]; then
            args+=(--force)
          fi
          python3 scripts/build-feed.py site "${args[@]}"
          if [[ -f site/release-state.json ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.feed.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
