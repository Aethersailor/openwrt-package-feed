name: Build LuCI Bluetooth packages

on:
  schedule:
    - cron: '13 19 * * *'
  workflow_dispatch:

concurrency:
  group: bluetooth-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.upstream.outputs.plan }}
      targets: ${{ steps.upstream.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: upstream
        name: Check the plugin and dependency source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(python3 scripts/bluetooth.py)
          if [[ -n "$plan" ]]; then
            echo "plan=$plan" >> "$GITHUB_OUTPUT"
            echo "targets=$(jq -c .targets <<< "$plan")" >> "$GITHUB_OUTPUT"
          else
            echo 'The Bluetooth source revisions are already published.'
          fi

  build:
    needs: check
    if: needs.check.outputs.plan != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libglib2.0-dev-bin libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev zstd
      - name: Build the Bluetooth package set
        env:
          BLUETOOTH_PLAN: ${{ needs.check.outputs.plan }}
          BLUETOOTH_ARCH: ${{ matrix.arch }}
          BLUETOOTH_TARGET: ${{ matrix.target }}
        run: bash scripts/build-bluetooth.sh "$BLUETOOTH_PLAN" "$BLUETOOTH_ARCH" "$BLUETOOTH_TARGET" "$RUNNER_TEMP/bluetooth-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compile-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/bluetooth-compile.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bluetooth-${{ matrix.arch }}
          path: ${{ runner.temp }}/bluetooth-dist/*
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bluetooth-*
          merge-multiple: true
          path: dist
      - name: Publish the Bluetooth package set
        working-directory: dist
        env:
          PLAN: ${{ needs.check.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -er .tag <<< "$PLAN")
          version=$(jq -er .version <<< "$PLAN")
          jq . <<< "$PLAN" > build-info.json
          sha256sum -- *.apk > SHA256SUMS
          jq -r '.sources | to_entries[] | "- [\(.key)](https://github.com/\(.value.repository)/tree/\(.value.commit))"' \
            build-info.json > "$RUNNER_TEMP/bluetooth-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "LuCI Bluetooth $version-r1" --notes-file "$RUNNER_TEMP/bluetooth-notes.md" \
            ./*.apk ./sdk-*.json build-info.json SHA256SUMS
