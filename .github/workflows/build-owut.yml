name: Build patched owut

on:
  schedule:
    - cron: '41 18 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built APK as a Release
        type: boolean
        default: false

concurrency:
  group: owut-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ImmortalWrt owut recipe
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/owut-plan.json"
          python3 scripts/owut.py "$plan"
          if [[ -f "$plan" ]]; then
            jq -r '"tag=\(.build_tag)", "version=\(.version)"' "$plan" >> "$GITHUB_OUTPUT"
          fi
      - name: Install SDK build dependencies
        if: steps.check.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev zstd
      - name: Build the noarch APK
        if: steps.check.outputs.tag != ''
        run: bash scripts/build-owut.sh "$RUNNER_TEMP/owut-plan.json" "$RUNNER_TEMP/owut-dist" "$RUNNER_TEMP/owut-work/sdk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.tag != ''
        with:
          name: owut-apk
          path: ${{ runner.temp }}/owut-dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag != '' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: owut-apk
          path: dist
      - name: Publish the patched owut
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jq -r '"Upstream source https://github.com/efahl/owut/tree/\(.source_commit)\n\nDirect sysupgrade call, install failure reporting and revision-scoped libubox compatibility. See build-info.json for build provenance."' \
            dist/build-info.json > "$RUNNER_TEMP/owut-notes.md"
          gh release create "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "owut $VERSION" --notes-file "$RUNNER_TEMP/owut-notes.md" \
            "dist/owut-$VERSION.apk" dist/build-info.json
