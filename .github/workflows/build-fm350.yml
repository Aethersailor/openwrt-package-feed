name: Build FM350 for aarch64_generic

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

concurrency:
  group: fm350-generic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the upstream APK against the last successful build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/fm350-plan.json"
          python3 scripts/fm350.py "$plan"
          if [[ -f "$plan" ]]; then
            jq -r '"tag=\(.build_tag)", "version=\(.version)"' "$plan" >> "$GITHUB_OUTPUT"
          fi
      - name: Install SDK build dependencies
        if: steps.check.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev zstd
      - name: Build the SNAPSHOT APK
        if: steps.check.outputs.tag != ''
        run: bash scripts/build-fm350.sh "$RUNNER_TEMP/fm350-plan.json" "$RUNNER_TEMP/fm350-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.tag != ''
        with:
          name: fm350-apk
          path: ${{ runner.temp }}/fm350-dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fm350-apk
          path: dist
      - name: Publish the FM350 build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jq -r '"Upstream source https://github.com/LianXia233/luci-app-fm350/tree/\(.source_commit)\n\nImmortalWrt SNAPSHOT \(.snapshot). See build-info.json for input and output hashes."' \
            dist/build-info.json > "$RUNNER_TEMP/fm350-notes.md"
          gh release create "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "luci-app-fm350 $VERSION (aarch64_generic)" --notes-file "$RUNNER_TEMP/fm350-notes.md" \
            "dist/luci-app-fm350-$VERSION.apk" dist/build-info.json
